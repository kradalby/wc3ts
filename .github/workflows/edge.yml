name: Edge release

# Garnix evaluates and builds every flake check for pushes and pull requests.
# GitHub Actions is reserved for publishing, where GITHUB_TOKEN is required.
on:
  push:
    branches:
      - main

concurrency:
  group: edge-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0

      - name: Setup Nix cache
        uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: v3.1.0

      - name: Build snapshot release
        run: goreleaser release --snapshot --clean

      - name: Replace edge release
        run: |
          gh release delete edge --yes --cleanup-tag || true
          mapfile -t artifacts < <(
            find dist -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \
                 -o -name '*.rpm' -o -name 'checksums.txt' \) \
              -print | sort
          )
          gh release create edge \
            --title "Edge (unstable)" \
            --notes "Automated pre-release from main branch. **Not recommended for production use.**

            Built from commit: ${{ github.sha }}" \
            --prerelease \
            "${artifacts[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
